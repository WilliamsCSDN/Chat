<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百炼大模型对话</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>百炼 AI</h2>
            </div>
            <button class="new-chat-btn" id="newChatBtn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                新建对话
            </button>
            <div class="session-list" id="sessionList"></div>
            <div class="sidebar-footer">
                <span class="model-label">当前模型</span>
                <select id="modelSelect">
                    <option value="qwen3.5-plus">qwen3.5-plus</option>
                    <option value="qwen-turbo">qwen-turbo</option>
                    <option value="qwen-plus">qwen-plus</option>
                    <option value="qwen-max">qwen-max</option>
                </select>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="chat-tabs">
                <button class="chat-tab active" data-tab="normal">普通对话</button>
                <button class="chat-tab" data-tab="pdf">PDF-RAG 对话</button>
            </div>

            <section class="tab-panel active" id="normalTabPanel">
                <!-- 消息区域 -->
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">🤖</div>
                        <h1>欢迎使用百炼 AI 对话</h1>
                        <p>基于阿里云百炼大模型，开始你的智能对话之旅</p>
                        <div class="quick-prompts">
                            <button class="prompt-btn" data-prompt="请介绍一下你自己">介绍一下你自己</button>
                            <button class="prompt-btn" data-prompt="用Python写一个快速排序算法">写一个快排算法</button>
                            <button class="prompt-btn" data-prompt="帮我解释一下什么是机器学习">什么是机器学习</button>
                            <button class="prompt-btn" data-prompt="给我讲一个有趣的编程笑话">讲个编程笑话</button>
                        </div>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="输入你的问题... (Enter 发送，Shift+Enter 换行)"
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" title="发送消息">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M18 2L9 11M18 2L12 18L9 11M18 2L2 8L9 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button class="stop-btn hidden" id="stopBtn" title="停止生成">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-hint">百炼大模型可能会产生不准确的信息，请注意甄别</div>
                </div>
            </section>

            <section class="tab-panel" id="pdfTabPanel">
                <div class="chat-messages" id="pdfChatMessages">
                    <div class="welcome-screen">
                        <div class="welcome-icon">📄</div>
                        <h1>PDF-RAG 对话</h1>
                        <p>输入问题后将基于 `kaoqin.pdf` 的 Milvus 切分数据进行检索问答</p>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea
                            id="pdfMessageInput"
                            placeholder="输入 PDF 制度问题... (Enter 发送，Shift+Enter 换行)"
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="pdfSendBtn" title="发送 PDF-RAG 问题">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M18 2L9 11M18 2L12 18L9 11M18 2L2 8L9 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-hint">PDF-RAG 会先检索 Milvus，再由模型生成答案</div>
                </div>
            </section>
        </main>

        <!-- OpenAI 规范交互面板 -->
        <aside class="openai-inspector" id="openaiInspector">
            <div class="openai-inspector-header">
                <h3>OpenAI 交互</h3>
                <span class="openai-inspector-hint">Chat Completions 协议</span>
            </div>
            <div class="openai-inspector-section">
                <div class="openai-inspector-section-title">Messages</div>
                <div class="openai-messages" id="openaiMessages">
                    <div class="openai-empty">对话开始后将显示 messages 时间线</div>
                </div>
            </div>
            <div class="openai-inspector-section openai-inspector-section-calls">
                <div class="openai-inspector-section-title">Model Calls</div>
                <div class="openai-model-calls" id="openaiModelCalls">
                    <div class="openai-empty">模型请求/响应将显示在此处</div>
                </div>
            </div>
        </aside>
    </div>

    <script src="/static/app.js?v=5"></script>
</body>
</html>
